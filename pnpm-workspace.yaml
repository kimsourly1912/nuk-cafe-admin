allowBuilds:
  core-js-pure: false
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - '@nuxtjs/better-auth@0.3.5'
# undici 7.29.1 fixes GHSA-w293-vg96-wgc3 and GHSA-rfgv-xxqx-mfg5 (high); wrangler > miniflare pins 7.29.0.
# Remove once wrangler ships a miniflare on a patched undici.
overrides:
  undici@7: ^7.29.1
  # D160: DevTools 3.4.2 uses the v3 default export; the paired patch adapts its import to v4.
  '@nuxt/devtools@3.4.2>simple-git': 4.0.2
  # Patched high/critical transitive advisories; remove when upstream constraints resolve these.
  tinypool@2: 2.1.2
  source-map-js@1: 1.2.2
# node-forge GHSA-86w9-cpqp-85rv (high, no patched version): only through listhen, the dev server's
# HTTPS listener (nuxt > @nuxt/cli, nitropack > listhen); not in the Worker build. Remove once
# node-forge ships a fix (D54).
# braces GHSA-vfj7-8cjw-p6xm (high, stack exhaustion on deeply nested patterns; no patched version):
# only through the build's file globbing (nitropack > globby > fast-glob > micromatch), fed our own
# patterns; not in the built server. Remove once braces ships a fix (D54).
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
patchedDependencies:
  '@nuxt/devtools@3.4.2': patches/@nuxt__devtools@3.4.2.patch
