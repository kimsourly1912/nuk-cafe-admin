allowBuilds:
  esbuild: true
  unrs-resolver: true  
  vue-demi: true
  workerd: true
# undici 7.29.1 fixes GHSA-w293-vg96-wgc3 and GHSA-rfgv-xxqx-mfg5 (high); wrangler > miniflare pins 7.29.0.
# Remove once wrangler ships a miniflare on a patched undici.
overrides:
  undici@7: ^7.29.1
  tinypool@2: ^2.1.2
  sharp@0.35: ^0.35.5
# braces GHSA-vfj7-8cjw-p6xm (high, stack exhaustion on deeply nested patterns; no patched version):
# only through the build's file globbing (nitropack > globby > fast-glob > micromatch), fed our own
# patterns; not in the built server. Remove once braces ships a fix (D54).
# tinypool (oxfmt, lint) and sharp (wrangler > miniflare, local Workers only): patch versions forced
# for GHSA-5gmw-xhrv-c9v3, GHSA-85c8-ppgw-ccpr and GHSA-wq5f-xc86-pv6w, which their parents pin (2026-10-08).
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
# @nuxt/ui: UFormField's error / help line swaps through a <Transition name="field-message"> (D264),
# so an error eases out when the value is fixed; the library removes it with a bare v-if, which no
# theme class can animate. Re-create the patch on every @nuxt/ui upgrade (`pnpm patch @nuxt/ui`);
# install fails loudly when it no longer applies. CSS: `.field-message-*` in app/assets/css/tailwind.css.
patchedDependencies:
  '@nuxt/ui@4.12.0': patches/@nuxt__ui@4.12.0.patch
