    <path class="paper" d="M97 195H198L192 266H103Z"/>
    <path class="wash" opacity=".12" d="M97 195H198L192 266H103Z" stroke="none"/>
    <ellipse cx="147" cy="231" rx="21" ry="14" transform="rotate(-39 147 231)"/>
