<svg xmlns="http://www.w3.org/2000/svg" width="440" height="360" viewBox="0 0 440 360" fill="none" role="img" aria-labelledby="cafe-closed-title cafe-closed-desc" data-theme="auto">
  <title id="cafe-closed-title">Cafe closed</title>
  <desc id="cafe-closed-desc">A takeaway coffee cup beside a hanging closed sign.</desc>
  <!-- Transparent background. Use data-theme="light" or "dark" on this SVG
       to force a palette. Inline SVG also follows an ancestor .dark,
       .light, or data-theme attribute. External img follows system theme. -->
  <style>
    svg { --cafe-ink: #9b6b16; --cafe-wash: #d5a438; --cafe-paper: #fffaf0; }
    @media (prefers-color-scheme: dark) {
      svg { --cafe-ink: #f4c752; --cafe-wash: #d6a024; --cafe-paper: #29231b; }
    }
    .light svg, [data-theme="light"] svg, svg[data-theme="light"] {
      --cafe-ink: #9b6b16; --cafe-wash: #d5a438; --cafe-paper: #fffaf0;
    }
    .dark svg, [data-theme="dark"] svg, svg[data-theme="dark"] {
      --cafe-ink: #f4c752; --cafe-wash: #d6a024; --cafe-paper: #29231b;
    }
    .ink { stroke: var(--cafe-ink); }
    .paper { fill: var(--cafe-paper); }
    .wash { fill: var(--cafe-wash); }
  </style>
  <path class="wash" opacity=".13" d="M54 244C28 217 43 178 78 157C113 136 106 82 150 52C188 26 236 26 270 52C304 77 297 111 316 145C334 176 377 185 395 215C422 260 387 297 343 304C294 312 257 296 211 305C156 316 85 293 54 244Z"/>
