    <path class="wash" opacity=".09" d="M93 157H202L188 312C187.5 317 184 321 179 321H116C111 321 107.5 317 107 312Z" stroke="none"/>
    <path class="paper" d="M101 141L105 128C106 124 109 122 113 122H181C185 122 188 124 189 128L193 141Z"/>
