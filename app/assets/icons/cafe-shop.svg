<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 650 570" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cafe not found</title>
  <desc id="desc">A softly colored cafe storefront with an unfinished dashed roof, potted plants, and a peach-colored X badge.</desc>
