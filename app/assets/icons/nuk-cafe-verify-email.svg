<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-labelledby="title desc">
<title id="title">Verify your email</title>
<desc id="desc">An open golden envelope holding a letter with three lines, in front of a soft cream cloud.</desc>
<defs>
  <linearGradient id="cloud" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#FFF7EB"/><stop offset="1" stop-color="#FDEBCF"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF6EB"/></linearGradient>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFC76A"/><stop offset="1" stop-color="#EFA53D"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#FFE1A0"/><stop offset="1" stop-color="#FFC361"/></linearGradient>
  <filter id="shadow" x="-25%" y="-35%" width="150%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#BA792F" flood-opacity=".13"/></filter>
</defs>
<!-- quiet, soft abstract cloud -->
<path d="M44 178c-22 0-37-14-37-33 0-19 15-33 35-34 2-39 33-70 72-70 30 0 56 17 68 42 10-7 22-11 36-11 31 0 56 21 58 49 20 2 36 16 36 34 0 19-17 34-39 34H44z" fill="url(#cloud)" opacity=".9"/>
<ellipse cx="161" cy="207" rx="93" ry="8" fill="#F4DBC0" opacity=".55"/>
<!-- little celebratory marks -->
<g fill="none" stroke="#E8A04A" stroke-width="5" stroke-linecap="round"><path d="M242 43l8-14"/><path d="M257 62l16-10"/><path d="M264 84l18-2"/></g>
<!-- envelope with mail -->
<g filter="url(#shadow)">
  <path d="M82 106 153 54c4-3 10-3 14 0l72 52v82c0 11-8 19-19 19H101c-11 0-19-8-19-19z" fill="url(#back)" stroke="#BD6E26" stroke-width="3" stroke-linejoin="round"/>
  <rect x="111" y="68" width="99" height="110" rx="7" fill="url(#paper)" stroke="#D89750" stroke-width="2.5"/>
  <path d="M131 96h59M131 113h59M131 130h42" stroke="#E3BA87" stroke-width="7" stroke-linecap="round"/>
  <path d="M83 109 149 163c7 6 15 6 22 0l67-54v79c0 10-8 18-18 18H102c-11 0-19-8-19-19z" fill="url(#front)"/>
  <path d="m83 109 72 59-66 30" fill="#EFB056" opacity=".64"/>
  <path d="m238 109-72 59 65 30" fill="#F6B655" opacity=".64"/>
  <path d="m84 198 66-50c7-5 14-5 21 0l66 50" fill="#FFE09C" stroke="#F7C06B" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M83 110v77c0 11 8 19 19 19h118c10 0 18-8 18-18v-78" fill="none" stroke="#B97633" stroke-width="3" stroke-linejoin="round"/>
</g>
</svg>