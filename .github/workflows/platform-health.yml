# Independent of the Worker, D1, and Telegram. Configure the URL to enable monitoring.
name: Platform health
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: platform-health
  cancel-in-progress: false
jobs:
  health:
    if: vars.PLATFORM_HEALTH_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the platform database health
        env:
          PLATFORM_HEALTH_URL: ${{ vars.PLATFORM_HEALTH_URL }}
        run: |
          set -eu
          curl --proto '=https' --fail --silent --show-error --max-time 10 --retry 2 --retry-delay 5 --output health.json "$PLATFORM_HEALTH_URL"
          python3 -c 'import json; assert json.load(open("health.json")).get("status") == "ok", "Platform health is unavailable"'
