# Checks on each pull request; a push to main (a merged pull request) deploys to staging without
# running them again: the pull request already checked the code merged with main as it was (D133).
# Run the workflow by hand (Actions → CI → Run workflow) to check main itself, e.g. after merging
# two pull requests back to back.
# E2E runs against a production build in the runner's preinstalled Google Chrome
# (test/e2e/support/global-setup.ts); the backend is mocked, so the checks need no secrets.
# Setup follows https://pnpm.io/continuous-integration (decision D24). Deploy: D54; production: D211.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      production:
        description: Deploy this main revision to production after every check passes (asks the production environment's reviewer first)
        type: boolean
        default: false

# The workflow token can only read the repository: no job writes to GitHub. Deploys use the
# Cloudflare token instead, so a compromised step can't also push code or change releases (D244).
permissions:
  contents: read

# A newer push to a pull request cancels its older run. On main, never: the deploy starts right
# away (D133), and a cancel between the migrations and the Worker would leave staging half done.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Pull requests and runs by hand; not a push to main (D133).
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the project's Node.js requirement
        id: node
        run: |
          version=$(jq -er '.engines.node' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Installs pnpm (packageManager) and Node (engines.node) from package.json, then `pnpm install`
      # (frozen lockfile in CI) with the store cached. Pinned by commit: v2.0.0.
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@${{ steps.node.outputs.version }}
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Known advisories below "high" are accepted and reviewed when dependencies are updated.
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high

      - name: Unit tests
        run: pnpm test:unit

  # A private repository's runner has 2 cores, so Vitest ran the e2e files one after another
  # (about 5 minutes). Three shards run side by side on three runners, each building the app once
  # (D56). Add a shard when the slowest one passes about 2 minutes.
  e2e:
    name: e2e (${{ matrix.shard }}/3)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the project's Node.js requirement
        id: node
        run: |
          version=$(jq -er '.engines.node' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@${{ steps.node.outputs.version }}
          cache: true

      - name: E2E tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3
        # The build needs about 3 GB of heap; Node's default on this runner is smaller (D147).
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  deploy-staging:
    # Only a push to main (a merged pull request, checked there: D133); pull requests and runs by
    # hand never deploy. The smoke check below still guards the deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.angder.app
    # One deploy at a time, and a newer push never cancels one halfway (migrations then Worker).
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://staging.angder.app
      # A Cloudflare Access service token, once staging is behind Access (D244): the smoke check
      # sends it so Access lets it through. Unset, nothing is sent (staging is public).
      STAGING_ACCESS_CLIENT_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
      STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the project's Node.js requirement
        id: node
        run: |
          version=$(jq -er '.engines.node' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@${{ steps.node.outputs.version }}
          cache: true

      - name: Build the staging Worker
        run: pnpm build:staging
        # The build needs about 3 GB of heap; Node's default on this runner (about 2 GB, from its
        # 7 GB of memory) aborted it with exit code 134 (D147).
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Before the new Worker: migrations are backwards compatible (expand, then contract), so the
      # old Worker keeps working against the migrated database for the moment in between.
      - name: Apply database migrations
        run: pnpm db:migrate:staging

      - name: Deploy the Worker
        run: pnpm exec wrangler deploy --config .output/server/wrangler.json

      - name: Smoke check
        run: |
          set -eu
          access=()
          if [ -n "$STAGING_ACCESS_CLIENT_ID" ]; then
            access=(--header "CF-Access-Client-Id: $STAGING_ACCESS_CLIENT_ID" --header "CF-Access-Client-Secret: $STAGING_ACCESS_CLIENT_SECRET")
          fi
          get() { curl "${access[@]}" "$@"; }
          # The database answers through the Worker.
          get --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$STAGING_URL/api/health" | grep -q '"ok"'
          # NUK Cafe answers at its address `nuk` (D141, 0029); if not, show what the Worker said.
          code="$(get --silent --output cafe.json --write-out '%{http_code}' "$STAGING_URL/api/c/nuk/public/branches")"
          if [ "$code" != 200 ]; then echo "GET /api/c/nuk/public/branches answered $code:"; cat cafe.json; echo; exit 1; fi
          # The app shell loads at NUK Cafe's address (D141), with the security headers.
          get --fail --silent --show-error --head "$STAGING_URL/c/nuk/admin/login" | grep -qi '^content-security-policy:'
          # The site's root is the platform's, and addresses from before cafe addresses lead into no cafe (D221).
          # Same text as platform-home.test.ts checks in the server's HTML: change both together.
          get --fail --silent --show-error "$STAGING_URL/" | grep -q 'scan the QR code shared by your cafe'
          test "$(get --silent --output /dev/null --write-out '%{http_code}' "$STAGING_URL/admin/login")" = 404
          # An unknown API path is our JSON 404, not the app's HTML.
          test "$(get --silent --output /dev/null --write-out '%{http_code}' "$STAGING_URL/api/does-not-exist")" = 404
          # A cafe's admin routes refuse without a session (NUK Cafe's address, D140).
          test "$(get --silent --output /dev/null --write-out '%{http_code}' "$STAGING_URL/api/c/nuk/admin/me")" = 401
          echo "Staging is up: $STAGING_URL"

  verified-release:
    # A promotion candidate exists only after this exact main revision passes every required job.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record the checked revision
        env:
          VERIFIED_SHA: ${{ github.sha }}
          VERIFIED_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('verified-release.json', 'w') as output:
              json.dump({'commit': os.environ['VERIFIED_SHA'], 'checks': os.environ['VERIFIED_RUN']}, output)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-${{ github.sha }}
          path: verified-release.json
          retention-days: 30

  deploy-production:
    # By hand only (Actions → CI → Run workflow on main, "production" ticked), after this exact
    # revision passed every check (D211). The `production` environment's required reviewer approves
    # it, after checking the same revision on staging.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production
    needs: [verified-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://angder.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://angder.app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the project's Node.js requirement
        id: node
        run: |
          version=$(jq -er '.engines.node' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@${{ steps.node.outputs.version }}
          cache: true

      - name: Build the production Worker
        run: pnpm build:production
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The point to restore to if the migrations go wrong (D1 Time Travel, operations.md → Backups).
      - name: Record the database bookmark
        run: |
          set -eu
          pnpm exec wrangler d1 time-travel info DB --json --config .output/server/wrangler.json > bookmark.json
          echo "D1 Time Travel before this deploy: \`$(jq -r '.bookmark' bookmark.json)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply database migrations
        run: pnpm db:migrate:production

      - name: Deploy the Worker
        run: pnpm exec wrangler deploy --config .output/server/wrangler.json

      # No cafe-specific address: production may have no cafe yet.
      - name: Smoke check
        run: |
          set -eu
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$PRODUCTION_URL/api/health" | grep -q '"ok"'
          curl --fail --silent --show-error --head "$PRODUCTION_URL/sign-in" | grep -qi '^content-security-policy:'
          curl --fail --silent --show-error --head "$PRODUCTION_URL/platform/sign-in" | grep -qi '^strict-transport-security:'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/api/does-not-exist")" = 404
          echo "Production is up: $PRODUCTION_URL"
