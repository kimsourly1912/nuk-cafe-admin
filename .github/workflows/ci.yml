# Checks on each pull request; a push to main (a merged pull request) deploys to staging without
# running them again: the pull request already checked the code merged with main as it was (D133).
# Run the workflow by hand (Actions → CI → Run workflow) to check main itself, e.g. after merging
# two pull requests back to back.
# E2E runs against a production build in the runner's preinstalled Google Chrome
# (test/e2e/support/global-setup.ts); the backend is mocked, so the checks need no secrets.
# Setup follows https://pnpm.io/continuous-integration (decision D24). Deploy: D54.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its older run. On main, never: the deploy starts right
# away (D133), and a cancel between the migrations and the Worker would leave staging half done.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Pull requests and runs by hand; not a push to main (D133).
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # Installs pnpm (version from package.json → packageManager), Node, and runs `pnpm install`
      # (frozen lockfile in CI) with the store cached. Pinned by commit: v2.0.0.
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Known advisories below "high" are accepted and reviewed when dependencies are updated.
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high

      - name: Unit tests
        run: pnpm test:unit

  # A private repository's runner has 2 cores, so Vitest ran the e2e files one after another
  # (about 5 minutes). Three shards run side by side on three runners, each building the app once
  # (D56). Add a shard when the slowest one passes about 2 minutes.
  e2e:
    name: e2e (${{ matrix.shard }}/3)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true

      - name: E2E tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3

  assistant-preview:
    # Temporary same-repository PR94 preview only. No fork code receives deployment credentials.
    # These fixed resources are separate from staging; never activate the staging import flag.
    # Live Free CPU failed D161's release gate. Further deployments/metered checks are opt-in;
    # skipping this job does not certify the outstanding live quality or activation gates.
    if: vars.ASSISTANT_PREVIEW_LIVE == 'true' && github.event_name == 'pull_request' && github.event.repository.private && github.event.pull_request.number == 94 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/cloudflare-assistant-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    environment: staging
    concurrency:
      group: assistant-preview
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NODE_OPTIONS: --max-old-space-size=6144
      PREVIEW_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true
      - name: Reuse the unchanged private preview while debugging checks
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every application/build input must match the deployed revision. Docs/check changes
          # can reuse it, avoiding redundant builds, password rotations and model calls.
          if git diff --quiet 045f5b9f258dd896f5bc7488984d52de8bc5d588 HEAD -- app shared server public nuxt.config.ts app.config.ts package.json pnpm-lock.yaml pnpm-workspace.yaml patches scripts/assistant-preview/gateway.mjs scripts/assistant-preview/prepare.mjs && gh run download 37422895593 --repo "$GITHUB_REPOSITORY" --name assistant-preview-access --dir .data/assistant-preview && node --input-type=module -e "import {readFileSync} from 'node:fs'; process.exit(Date.parse(JSON.parse(readFileSync('.data/assistant-preview/access.json')).expiresAt) > Date.now() ? 0 : 1)"; then
            chmod 600 .data/assistant-preview/access.json
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
            echo 'deployed_revision=045f5b9f258dd896f5bc7488984d52de8bc5d588' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            echo "deployed_revision=$PREVIEW_REVISION" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and prepare isolated preview
        if: steps.preview.outputs.reuse != 'true'
        run: |
          pnpm build:staging
          node scripts/assistant-preview/prepare.mjs
      - name: Migrate and seed only the preview database
        if: steps.preview.outputs.reuse != 'true'
        run: |
          pnpm exec wrangler d1 migrations apply DB --remote --config .output/server/wrangler.json
          pnpm exec wrangler d1 execute DB --remote --config .output/server/wrangler.json --file .data/assistant-preview/seed.sql
      - name: Deploy private application and protected gateway
        if: steps.preview.outputs.reuse != 'true'
        run: |
          pnpm exec wrangler deploy --config .output/server/wrangler.json --secrets-file .data/assistant-preview/app-secrets.json
          pnpm exec wrangler deploy --config .data/assistant-preview/gateway.json --secrets-file .data/assistant-preview/gateway-secrets.json
      - name: Verify authenticated preview flow
        env:
          PREVIEW_REVISION: ${{ steps.preview.outputs.deployed_revision }}
        run: node scripts/assistant-preview/check.mjs
      - name: Save sanitized preview results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assistant-preview-results
          path: .data/assistant-preview/results.json
          retention-days: 7
          include-hidden-files: true
      - name: Save temporary preview access for repository reviewers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assistant-preview-access
          path: .data/assistant-preview/access.json
          retention-days: 1
          include-hidden-files: true

  deploy-staging:
    # Only a push to main (a merged pull request, checked there: D133); pull requests and runs by
    # hand never deploy. The smoke check below still guards the deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://nuk-cafe-staging.kimsur61.workers.dev
    # One deploy at a time, and a newer push never cancels one halfway (migrations then Worker).
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://nuk-cafe-staging.kimsur61.workers.dev
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true

      - name: Build the staging Worker
        run: pnpm build:staging

      # Before the new Worker: migrations are backwards compatible (expand, then contract), so the
      # old Worker keeps working against the migrated database for the moment in between.
      - name: Apply database migrations
        run: pnpm db:migrate:staging

      - name: Deploy the Worker
        run: pnpm exec wrangler deploy --config .output/server/wrangler.json

      # From the GitHub environment's secret; skipped while it isn't set. Re-sent on every deploy so
      # the Worker always has the current value.
      - name: Update the Resend key
        env:
          NUXT_MAIL_RESEND_API_KEY: ${{ secrets.NUXT_MAIL_RESEND_API_KEY }}
        run: |
          if [ -n "$NUXT_MAIL_RESEND_API_KEY" ]; then
            printf '%s' "$NUXT_MAIL_RESEND_API_KEY" | pnpm exec wrangler secret put NUXT_MAIL_RESEND_API_KEY --config .output/server/wrangler.json
          fi

      - name: Smoke check
        run: |
          set -eu
          # The database answers through the Worker.
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$STAGING_URL/api/health" | grep -q '"ok"'
          # NUK Cafe answers at its address `nuk` (D141, 0029); if not, show what the Worker said.
          code="$(curl --silent --output cafe.json --write-out '%{http_code}' "$STAGING_URL/api/c/nuk/public/branches")"
          if [ "$code" != 200 ]; then echo "GET /api/c/nuk/public/branches answered $code:"; cat cafe.json; echo; exit 1; fi
          # The app shell loads at NUK Cafe's address (D141), with the security headers.
          curl --fail --silent --show-error --head "$STAGING_URL/c/nuk/admin/login" | grep -qi '^content-security-policy:'
          # Addresses from before cafe addresses move to NUK Cafe's.
          test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' "$STAGING_URL/admin/login")" = "$STAGING_URL/c/nuk/admin/login"
          # An unknown API path is our JSON 404, not the app's HTML.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$STAGING_URL/api/does-not-exist")" = 404
          # A cafe's admin routes refuse without a session (NUK Cafe's address, D140).
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$STAGING_URL/api/c/nuk/admin/me")" = 401
          echo "Staging is up: $STAGING_URL"
